[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turbo-cloud-calculator"
version = "1.0.0"
description = "Калькулятор стоимости облачных ресурсов «Турбо Облака» (ООО «Турбо», ГК «РТК-ЦОД»)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Максим Бобров" }]
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
turbo-calc = "turbo_calc.cli:main"

[tool.setuptools.packages.find]
include = ["turbo_calc*"]

[tool.setuptools.package-data]
turbo_calc = ["data/*.json", "static/*.html", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=turbo_calc --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
